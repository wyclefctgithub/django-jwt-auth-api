{% extends "accounts/base.html" %}

{% block title %}Login{% endblock %}
{% block heading %}Login{% endblock %}

{% block content %}
<form method="post" action="/api/auth/login/" class="space-y-4">
    {% csrf_token %}

    <input name="email" type="email" placeholder="Email" required class="w-full px-4 py-2 border rounded">

    <input name="password" type="password" placeholder="Password" required class="w-full px-4 py-2 border rounded">

    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
        Login
    </button>

    <div class="text-sm text-center text-gray-500">
        <a href="/accounts/forgot-password/" class="text-blue-600">
            Forgot password?
        </a>
    </div>
</form>
{% endblock %}
