{% extends "accounts/base.html" %}

{% block title %}Profile{% endblock %}
{% block heading %}Your Profile{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data" action="/api/auth/profile/" class="space-y-4">
    {% csrf_token %}

    <input name="full_name" placeholder="Full name" class="w-full px-4 py-2 border rounded">

    <input name="avatar" type="file" class="w-full">

    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">
        Update Profile
    </button>
</form>

<form method="post" action="/api/auth/profile/" class="mt-4">
    {% csrf_token %}
    <input type="hidden" name="_method" value="delete">

    <button class="w-full bg-gray-300 text-gray-800 py-2 rounded hover:bg-gray-400">
        Delete Profile
    </button>
</form>
{% endblock %}
