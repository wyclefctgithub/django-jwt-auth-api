{% extends "accounts/base.html" %}

{% block title %}Forgot Password{% endblock %}
{% block heading %}Reset Password{% endblock %}

{% block content %}
<form method="post" action="/api/auth/forgot-password/" class="space-y-4">
    {% csrf_token %}

    <input name="email" type="email" placeholder="Your email" required class="w-full px-4 py-2 border rounded">

    <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700">
        Send Reset Link
    </button>
</form>
{% endblock %}
