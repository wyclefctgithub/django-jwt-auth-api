{% extends "accounts/base.html" %}

{% block title %}Set New Password{% endblock %}
{% block heading %}Choose New Password{% endblock %}

{% block content %}
<form method="post" class="space-y-4">
    {% csrf_token %}

    <input name="password" type="password" placeholder="New password" required class="w-full px-4 py-2 border rounded">

    <button type="submit" class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700">
        Reset Password
    </button>
</form>
{% endblock %}
